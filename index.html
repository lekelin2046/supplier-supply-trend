<meta charset="utf-8">

<style>

  }
  *{box-sizing:border-box;}

  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px;}
  h1{font-size:20px;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px;}
  .tabs{display:flex;gap:8px;margin-bottom:14px;}
  .tabs button{border:1px solid var(--line);background:var(--panel);color:var(--muted);
    padding:9px 16px;font-size:14px;border-radius:10px;cursor:pointer;}
  .tabs button.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;}
  .bar{position:sticky;top:0;background:var(--bg);padding:12px 0 14px;z-index:5;}
  .search{display:flex;gap:10px;align-items:center;}
  .search input{flex:1;min-width:240px;padding:12px 15px;font-size:15px;
    border:1px solid var(--line);border-radius:10px;background:var(--panel);outline:none;}
  .search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
  .search button{padding:12px 16px;font-size:14px;border:1px solid var(--line);
    background:var(--panel);border-radius:10px;cursor:pointer;}
  .search button:hover{background:#f0f1f3;}
  .stats{margin-top:12px;font-size:13px;color:var(--muted);}
  .stats b{color:var(--ink);}
  .stats .hl{color:var(--brand);}
  #hint{padding:60px 20px;text-align:center;color:var(--muted);font-size:15px;line-height:1.9;}
  #hint .big{font-size:34px;display:block;margin-bottom:10px;}
  #results{margin-top:10px;display:flex;flex-direction:column;gap:18px;}
  .card{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:16px 18px;
    box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .ch{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  .cname{font-size:17px;font-weight:700;}
  .ccode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--muted);}
  .ctotal{margin-left:auto;font-size:15px;font-weight:700;color:var(--brand);}
  .ctotal small{font-weight:400;color:var(--muted);font-size:12px;margin-right:4px;}
  svg{display:block;width:100%;height:auto;}
  .cap{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:#374151;}
  .cap b{color:var(--ink);}
  .cap .m{color:var(--muted);}
  .empty{padding:50px;text-align:center;color:var(--muted);}
  mark{background:var(--hi);border-radius:2px;padding:0 1px;}
  .rlist{margin-top:10px;display:flex;flex-direction:column;gap:8px;max-height:72vh;overflow:auto;}
  .ritem{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;}
  .rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;cursor:pointer;}
  .rhead:hover{background:#fafbfc;}
  .rname{font-size:15px;font-weight:600;}
  .rcode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--muted);}
  .rtotal{margin-left:auto;font-size:14px;font-weight:700;color:var(--brand);}
  .rtoggle{color:var(--muted);font-size:12px;width:16px;text-align:center;}
  .rchart{display:none;padding:6px 14px 14px;border-top:1px solid var(--line);}
  .rchart svg{height:240px;}

  .batch .tip{font-size:12px;color:var(--muted);margin-top:8px;}
  .tablewrap{margin-top:14px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);}
  table{border-collapse:collapse;width:100%;font-size:13px;}
  th,td{padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);}
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left;}
  thead th{position:sticky;top:0;background:#fafafa;cursor:pointer;user-select:none;
    font-weight:600;color:#374151;border-bottom:2px solid var(--line);}

  tbody tr:hover{background:#fafbfc;cursor:pointer;}
  td.name{min-width:220px;}
  td.code{color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;}
  td.total{font-weight:700;color:var(--brand);}
  .zero{color:#b9bec6;}
  tfoot td{font-weight:700;background:#fafafa;border-top:2px solid var(--line);}
  .hidden{display:none;}
</style>
</head>

<div class="wrap">
  <h1>供应商 2026 上半年供货额 · 趋势查询</h1>
  <div class="sub">支持两种用法：① 单家查询看趋势图；② 批量查询粘贴多个名称/编码，出表格并可一键导出 Excel(.xlsx)。</div>

  <div class="tabs">
    <button id="tab-single" class="active" onclick="showTab('single')">单家查询</button>
    <button id="tab-batch" onclick="showTab('batch')">批量查询</button>
  </div>

  <!-- 单家查询 -->
  <div id="panel-single">
    <div class="bar">
      <div class="search">
        <input id="q" type="text" placeholder="输入客户名称">
        <button id="clear">清空</button>
      </div>
      <div class="stats" id="stats" style="display:none"></div>
    </div>
    <div id="hint">
      <span class="big">🔍</span>
      请输入客户名称或编码开始查询<br>
      支持模糊匹配，且不要求字连着：如「保定诚业」也能命中「保定市诚业…」；输入短词会列出全部匹配，点击任意一行即可展开趋势图
    </div>
    <div id="results"></div>
    <div class="empty" id="empty" style="display:none">未找到匹配的客户</div>
  </div>

  <!-- 批量查询 -->
  <div id="panel-batch" class="batch hidden">
    <textarea id="batchInput" placeholder="每行输入一个客户全称或编码。例如：&#10;广东麦格纳汽车镜像有限公司&#10;浙江长江汽车电子有限公司&#10;欧摩威汽车电子（芜湖）有限公司"></textarea>
    <div class="ops">
      <button class="primary" onclick="batchRender()">批量查询</button>
      <button onclick="batchClear()">清空</button>
      <button onclick="exportXLSX()">导出 Excel</button>
    </div>
    <div class="tip">多个词之间是「或」关系，命中结果自动去重并按汇总降序排列；点击表格中任意一行可查看该客户趋势图。</div>
    <div class="stats" id="batchStats" style="display:none"></div>
    <div class="tablewrap" id="batchTableWrap" style="display:none">
      <table id="bt">
        <thead>
          <tr>
            <th data-k="code">客户编码<span class="arr"></span></th>
            <th data-k="name">客户名称<span class="arr"></span></th>
            <th data-k="m0">1月<span class="arr"></span></th>
            <th data-k="m1">2月<span class="arr"></span></th>
            <th data-k="m2">3月<span class="arr"></span></th>
            <th data-k="m3">4月<span class="arr"></span></th>
            <th data-k="m4">5月<span class="arr"></span></th>
            <th data-k="m5">6月<span class="arr"></span></th>
            <th data-k="total">汇总<span class="arr">▼</span></th>
            <th data-k="avg">月均额<span class="arr"></span></th>
          </tr>
        </thead>
        <tbody id="btb"></tbody>
        <tfoot>
          <tr id="btf"><td></td><td>合计</td>
            <td id="bf0">0</td><td id="bf1">0</td><td id="bf2">0</td>
            <td id="bf3">0</td><td id="bf4">0</td><td id="bf5">0</td>
            <td id="bft">0</td><td></td></tr>
        </tfoot>
      </table>
      <div class="empty" id="batchEmpty" style="display:none">未匹配到任何客户，请检查输入的名称/编码</div>
    </div>
    <div id="batchTrend"></div>
  </div>

</div>

const MONTHS = ["1月","2月","3月","4月","5月","6月"];
// 名称归一化：转小写、全角括号/空格统一，提升模糊匹配容错（解决半角括号/空格导致匹配不到）
function norm(s){
  return (s||"").toLowerCase()
    .replace(/（/g,"(").replace(/）/g,")")
    .replace(/【/g,"[").replace(/】/g,"]")
    .replace(/《/g,"[").replace(/》/g,"]")
    .replace(/[　 ]/g,"");
}
DATA.forEach(d=>{ d._n = norm(d.name) + "|" + norm(d.code); });
let batchList = [];
let batchSortKey = "total", batchSortDir = -1;

function cf(n){
  n = +n||0;
  const a = Math.abs(n);
  if(a>=1e8) return (n/1e8).toFixed(2)+"亿";
  if(a>=1e4) return (n/1e4).toFixed(2)+"万";
  return n.toFixed(0);
}
const full = n => (+n||0).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function hl(t,q){if(!q)return escapeHtml(t);const i=t.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return escapeHtml(t);return escapeHtml(t.slice(0,i))+"<mark>"+escapeHtml(t.slice(i,i+q.length))+"</mark>"+escapeHtml(t.slice(i+q.length));}
// 子序列匹配：needle 的字符按顺序出现在 hay 中（可不连续）。如「保定诚业」命中「保定市诚业…」
function subseq(hay, needle){
  if(!needle) return true;
  let i=0;
  for(let j=0;j<hay.length && i<needle.length;j++){
    if(hay[j]===needle[i]) i++;
  }
  return i===needle.length;
}
// 高亮子序列命中的字符（贪心，不要求连续）
function hlSub(t,q){
  if(!q) return escapeHtml(t);
  const tl=t.toLowerCase(), ql=q.toLowerCase();
  let qIndex=0; const markPos=new Set();
  for(let j=0;j<t.length && qIndex<ql.length;j++){
    if(tl[j]===ql[qIndex]){ markPos.add(j); qIndex++; }
  }
  if(markPos.size===0) return escapeHtml(t);
  let out="";
  for(let j=0;j<t.length;j++){
    out += markPos.has(j)? "<mark>"+escapeHtml(t[j])+"</mark>" : escapeHtml(t[j]);
  }
  return out;
}

// 折线趋势图（SVG，自包含）
function trendSVG(m){
  const W=820,H=300, pl=64, pr=20, pt=24, pb=44;
  const iw=W-pl-pr, ih=H-pt-pb;
  const max=Math.max.apply(null, m.concat([1]));
  const niceMax = max*1.1;
  const X=i=> pl + (iw/5)*i;
  const Y=v=> pt + ih - (v/niceMax)*ih;
  let grid="", ylab="";
  for(let g=0; g<=4; g++){
    const val = niceMax*g/4;
    const yy = Y(val);
    grid += `<line x1="${pl}" y1="${yy.toFixed(1)}" x2="${W-pr}" y2="${yy.toFixed(1)}" stroke="#eef0f2" stroke-width="1"/>`;
    ylab += `<text x="${pl-8}" y="${(yy+4).toFixed(1)}" text-anchor="end" font-size="11" fill="#9aa0a6">${cf(val)}</text>`;
  }
  let xlab="";
  for(let i=0;i<6;i++){
    xlab += `<text x="${X(i).toFixed(1)}" y="${H-pb+20}" text-anchor="middle" font-size="12" fill="#6b7280">${MONTHS[i]}</text>`;
  }
  let line="", area="", dots="";
  m.forEach((v,i)=>{
    const x=X(i), y=Y(v);
    line += (i===0?"M":"L")+x.toFixed(1)+" "+y.toFixed(1)+" ";
  });
  area = `M${X(0).toFixed(1)} ${Y(0).toFixed(1)} `+m.map((v,i)=>`L${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(" ")+` L${X(5).toFixed(1)} ${Y(0).toFixed(1)} Z`;
  m.forEach((v,i)=>{
    const x=X(i), y=Y(v);
    dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="#c0392b" stroke="#fff" stroke-width="1.5"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">
    ${grid}${ylab}${xlab}
    <path d="${area}" fill="rgba(192,57,43,0.08)"/>
    <path d="${line}" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
  </svg>`;
}

function showTab(t){
  document.getElementById("tab-single").classList.toggle("active", t==="single");
  document.getElementById("tab-batch").classList.toggle("active", t==="batch");
  document.getElementById("panel-single").classList.toggle("hidden", t!=="single");
  document.getElementById("panel-batch").classList.toggle("hidden", t!=="batch");
}

/* ---------- 单家查询 ---------- */
function render(){
  const q = document.getElementById("q").value.trim();
  const qn = norm(q);
  const hint = document.getElementById("hint");
  const stats = document.getElementById("stats");
  const empty = document.getElementById("empty");
  const res = document.getElementById("results");

  if(!qn){ hint.style.display="block"; stats.style.display="none"; empty.style.display="none"; res.innerHTML=""; return; }
  hint.style.display="none";

  const list = DATA.filter(d => subseq(d._n, qn));
  list.sort((a,b)=>b.total-a.total);

  if(list.length===0){ empty.style.display="block"; res.innerHTML=""; stats.style.display="none"; return; }
  empty.style.display="none";
  stats.style.display="block";
  stats.innerHTML = `匹配 <b class="hl">${list.length}</b> 家客户` + (list.length>1?`（已列出全部，点击任意一行展开趋势图）`:``) + `，合计 <b>${cf(list.reduce((s,d)=>s+d.total,0))}</b> 元`;

  // 命中较少时自动展开趋势图；命中较多时以可滚动列表呈现，点击单行展开
  const autoOpen = list.length <= 8;
  res.innerHTML = `<div class="rlist">` + list.map(d=>{
    return `<div class="ritem">
      <div class="rhead" onclick="toggleChart('${d.code}')">
        <span class="rname">${hlSub(d.name,q)}</span>
        <span class="rcode">${hlSub(d.code,q)}</span>
        <span class="rtoggle" id="tg-${d.code}">${autoOpen?'▾':'▸'}</span>
        <span class="rtotal">${full(d.total)} 元</span>
      </div>
      <div class="rchart" id="ch-${d.code}" style="${autoOpen?'display:block':'display:none'}">${autoOpen?trendSVG(d.m):''}</div>
    </div>`;
  }).join("") + `</div>`;
}
function toggleChart(code){
  const ch = document.getElementById('ch-'+code);
  if(!ch) return;
  if(ch.style.display==='none'){
    const d = DATA.find(x=>x.code===code);
    if(d) ch.innerHTML = trendSVG(d.m);
    ch.style.display='block';
    const tg = document.getElementById('tg-'+code); if(tg) tg.textContent='▾';
  } else {
    ch.style.display='none';
    const tg = document.getElementById('tg-'+code); if(tg) tg.textContent='▸';
  }
}

/* ---------- 批量查询 ---------- */
function batchVal(d,k){
  if(k==="code"||k==="name") return (d[k]||"").toLowerCase();
  if(k==="total") return d.total;
  if(k==="avg") return d.avg==null?-1:d.avg;
  return d.m[parseInt(k.slice(1))];
}
function batchRender(){
  const raw = document.getElementById("batchInput").value;
  const terms = raw.split(/[\r\n]+/).map(s=>norm(s)).filter(Boolean);
  const map = new Map();
  if(terms.length){
    terms.forEach(tl=>{
      DATA.forEach(d=>{ if(norm(d.name)===tl || norm(d.code)===tl) map.set(d.code, d); });
    });
  }
  batchList = Array.from(map.values()).sort((a,b)=>b.total-a.total);
  batchRenderTable();
}
function batchRenderTable(){
  let list = batchList.slice().sort((a,b)=>{
    let va=batchVal(a,batchSortKey), vb=batchVal(b,batchSortKey);
    if(typeof va==="string"){return va<vb?-1*batchSortDir:va>vb?1*batchSortDir:0;}
    return (va-vb)*batchSortDir;
  });
  const tbody=document.getElementById("btb");
  const wrap=document.getElementById("batchTableWrap");
  const empty=document.getElementById("batchEmpty");
  const stats=document.getElementById("batchStats");

  if(list.length===0){
    wrap.style.display="none"; stats.style.display="none"; empty.style.display="none";
    return;
  }
  wrap.style.display="block"; empty.style.display="none"; stats.style.display="block";
  stats.innerHTML = `输入 <b>${document.getElementById("batchInput").value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).length}</b> 个查询词，命中 <b class="hl">${list.length}</b> 家（已去重），合计 <b>${cf(list.reduce((s,d)=>s+d.total,0))}</b> 元`;

  tbody.innerHTML = list.map(d=>{
    const cells = d.m.map(v=>`<td class="${v===0?'zero':''}">${full(v)}</td>`).join("");
    const avg = d.avg==null ? '<td class="zero">—</td>' : `<td>${full(d.avg)}</td>`;
    return `<tr data-code="${d.code}"><td class="code">${escapeHtml(d.code)}</td><td class="name">${escapeHtml(d.name)}</td>${cells}<td class="total">${full(d.total)}</td>${avg}</tr>`;
  }).join("");

  const sums=[0,0,0,0,0,0]; let tot=0;
  list.forEach(d=>{for(let i=0;i<6;i++)sums[i]+=d.m[i]; tot+=d.total;});
  for(let i=0;i<6;i++) document.getElementById("bf"+i).textContent = full(sums[i]);
  document.getElementById("bft").textContent = full(tot);

  document.querySelectorAll("#bt thead th .arr").forEach(a=>a.textContent="");
  const th=document.querySelector(`#bt thead th[data-k="${batchSortKey}"] .arr`);
  if(th) th.textContent = batchSortDir<0?"▼":"▲";
}
function batchClear(){
  document.getElementById("batchInput").value="";
  batchList=[];
  document.getElementById("batchTableWrap").style.display="none";
  document.getElementById("batchStats").style.display="none";
  document.getElementById("batchTrend").innerHTML="";
}
/* ---------- 纯前端导出 Excel(.xlsx)，完全离线，无需任何外部库 ---------- */
function crc32(buf){
  let table=crc32.table||(crc32.table=(function(){let t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++){c=c&1?(0xEDB88320^(c>>>1)):(c>>>1);}t[n]=c>>>0;}return t;})());
  let crc=0xFFFFFFFF;
  for(let i=0;i<buf.length;i++){crc=(crc>>>8)^table[(crc^buf[i])&0xFF];}
  return (crc^0xFFFFFFFF)>>>0;
}
function colLetter(n){let s='';n=n+1;while(n>0){let r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26);}return s;}
function xmlEscape(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function buildSheet(rows){
  let out='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  rows.forEach(function(row,ri){
    const r=ri+1; out+='<row r="'+r+'">';
    row.forEach(function(cell,ci){
      if(cell===null||cell===undefined||cell==='') return;
      const ref=colLetter(ci)+r;
      if(typeof cell==='number'){ out+='<c r="'+ref+'"><v>'+cell+'</v></c>'; }
      else { out+='<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEscape(cell)+'</t></is></c>'; }
    });
    out+='</row>';
  });
  out+='</sheetData></worksheet>';
  return out;
}
function makeXLSX(rows){
  const enc=new TextEncoder();
  const sheet=buildSheet(rows);
  const files=[
    {name:'[Content_Types].xml',data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>')},
    {name:'_rels/.rels',data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>')},
    {name:'xl/workbook.xml',data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="批量查询结果" sheetId="1" r:id="rId1"/></sheets></workbook>')},
    {name:'xl/_rels/workbook.xml.rels',data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>')},
    {name:'xl/worksheets/sheet1.xml',data:enc.encode(sheet)},
  ];
  const chunks=[]; const central=[]; let offset=0;
  for(let i=0;i<files.length;i++){
    const f=files[i];
    const nameBytes=enc.encode(f.name); const crc=crc32(f.data); const size=f.data.length;
    const lh=new Uint8Array(30+nameBytes.length); const dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0x0800,true);dv.setUint16(8,0,true);dv.setUint16(10,0,true);dv.setUint16(12,0,true);
    dv.setUint32(14,crc,true);dv.setUint32(18,size,true);dv.setUint32(22,size,true);dv.setUint16(26,nameBytes.length,true);dv.setUint16(28,0,true);lh.set(nameBytes,30);
    chunks.push(lh);chunks.push(f.data);
    const ch=new Uint8Array(46+nameBytes.length); const cdv=new DataView(ch.buffer);
    cdv.setUint32(0,0x02014b50,true);cdv.setUint16(4,20,true);cdv.setUint16(6,20,true);cdv.setUint16(8,0x0800,true);cdv.setUint16(10,0,true);cdv.setUint16(12,0,true);cdv.setUint16(14,0,true);
    cdv.setUint32(16,crc,true);cdv.setUint32(20,size,true);cdv.setUint32(24,size,true);cdv.setUint16(28,nameBytes.length,true);cdv.setUint16(30,0,true);cdv.setUint16(32,0,true);cdv.setUint16(34,0,true);cdv.setUint16(36,0,true);cdv.setUint32(38,0,true);cdv.setUint32(42,offset,true);
    ch.set(nameBytes,46);central.push(ch);offset+=lh.length+size;
  }
  const all=chunks.concat(central);
  const cdSize=central.reduce(function(a,c){return a+c.length;},0);
  const end=new Uint8Array(22); const edv=new DataView(end.buffer);
  edv.setUint32(0,0x06054b50,true);edv.setUint16(4,0,true);edv.setUint16(6,0,true);edv.setUint16(8,files.length,true);edv.setUint16(10,files.length,true);edv.setUint32(12,cdSize,true);edv.setUint32(16,offset,true);edv.setUint16(20,0,true);
  all.push(end);
  return new Blob(all,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function exportXLSX(){
  if(!batchList.length){ alert('请先点击「批量查询」得到结果后再导出。'); return; }
  const head=['客户编码','客户名称','1月','2月','3月','4月','5月','6月','汇总','月均额'];
  const rows=[head];
  batchList.forEach(function(d){
    const row=[d.code,d.name];
    d.m.forEach(function(v){ row.push(v); });
    row.push(d.total);
    row.push(d.avg==null? '': d.avg);
    rows.push(row);
  });
  const blob=makeXLSX(rows);
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='供应商批量查询结果.xlsx';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------- 事件绑定 ---------- */
document.getElementById("q").addEventListener("input", render);
document.getElementById("q").addEventListener("keydown", e=>{ if(e.key==="Escape"){e.target.value="";render();} });
document.getElementById("clear").addEventListener("click", ()=>{ document.getElementById("q").value=""; render(); });

document.getElementById("batchInput").addEventListener("keydown", e=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){ batchRender(); } });

document.querySelectorAll("#bt thead th").forEach(th=>{
  th.addEventListener("click",()=>{
    const k=th.dataset.k;
    if(batchSortKey===k){ batchSortDir*=-1; } else { batchSortKey=k; batchSortDir=(k==="code"||k==="name")?1:-1; }
    batchRenderTable();
  });
});
document.getElementById("btb").addEventListener("click", e=>{
  const tr=e.target.closest("tr"); if(!tr) return;
  const code=tr.dataset.code;
  const d=DATA.find(x=>x.code===code); if(!d) return;
  const box=document.getElementById("batchTrend");
  const cap=MONTHS.map((mm,i)=>`<span class="m">${mm}</span> <b>${cf(d.m[i])}</b>`).join("");
  box.innerHTML=`<div class="card"><div class="ch"><span class="cname">${escapeHtml(d.name)}</span>`+
    `<span class="ccode">${escapeHtml(d.code)}</span>`+
    `<span class="ctotal"><small>汇总</small>${full(d.total)} 元</span></div>${trendSVG(d.m)}<div class="cap">${cap}</div></div>`;
  box.scrollIntoView({behavior:"smooth",block:"nearest"});
});

render();
</script>
